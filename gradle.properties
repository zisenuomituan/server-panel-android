# 本机内存紧张，压低堆并关闭并行/守护进程，避免把手机打进 swap
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=192m -XX:-UseContainerSupport -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.workers.max=1
android.useAndroidX=true
android.enableJetifier=false
# 本机是 aarch64，gradle 下载的 x86_64 aapt2 无法运行，强制使用系统 aapt2
android.aapt2FromMavenOverride=/usr/bin/aapt2
