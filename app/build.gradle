plugins {
    id 'com.android.application'
}

// 默认服务器地址：开源版回退到占位地址，可在本地用不进库的配置覆盖
def privateProps = new Properties()
def externalFile = new File(System.getProperty('user.home'), '.config/server-panel-android/private.properties')
if (externalFile.exists()) {
    externalFile.withInputStream { privateProps.load(it) }
}
def localFile = rootProject.file('private.properties')
if (localFile.exists()) {
    localFile.withInputStream { privateProps.load(it) }
}
def defaultServer = System.getenv('PANEL_SERVER_URL') ?: privateProps.getProperty('server.url', 'https://your-panel.example')

// 是否自用构建：存在任一私有配置即为自用版，版本显示与检查更新只在自用版启用
def selfUse = externalFile.exists() || localFile.exists()
def selfUseProp = privateProps.getProperty('self.use')
if (selfUseProp != null) {
    selfUse = selfUseProp.toBoolean()
}
def manifestUrl = privateProps.getProperty('update.manifest', defaultServer + '/android/latest.json')

// 正式签名：仓库里不放任何签名信息，口令从用户目录下的不进库文件读取
def signingProps = new Properties()
def signingFile = new File(System.getProperty('user.home'), '.config/server-panel-android/signing.properties')
if (signingFile.exists()) {
    signingFile.withInputStream { signingProps.load(it) }
}
def hasReleaseSigning = signingFile.exists() && signingProps.getProperty('storeFile')

android {
    namespace 'com.xianyunb.serverpanel'
    compileSdk 34

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(signingProps.getProperty('storeFile'))
                storePassword signingProps.getProperty('storePassword')
                keyAlias signingProps.getProperty('keyAlias')
                keyPassword signingProps.getProperty('keyPassword')
            }
        }
    }

    defaultConfig {
        applicationId "com.xianyunb.serverpanel"
        minSdk 23
        targetSdk 34
        versionCode 9
        versionName "0.5.1"
        buildConfigField "String", "DEFAULT_SERVER_URL", "\"${defaultServer}\""
        buildConfigField "boolean", "SELF_USE", "${selfUse}"
        buildConfigField "String", "UPDATE_MANIFEST_URL", "\"${manifestUrl}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 有正式签名就用正式签名（自用版）；没有则回退 debug 签名，保证开源版 clone 后能直接编译安装
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    // 离线环境缺少 lint 依赖，正式构建不做 lint 检查
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
